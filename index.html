 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>المدینہ جنرل سٹور - میلسی</title>
<style>
body { font-family: Arial; background: #f5f5f5; text-align: center; margin:0; padding:10px; }
h1 { background: #1b5e20; color: white; padding: 15px; border-radius: 10px; margin:10px; }
.top-bar { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin:10px; }
.top-bar button, .top-bar input { padding:10px 15px; border-radius:8px; border:none; font-weight:bold; cursor:pointer; }
.btn-add { background:#2e7d32; color:white; } .btn-print { background:#1565c0; color:white; } .btn-clear { background:#6d4c41; color:white; }
.add-box { background:white; max-width:650px; margin:10px auto; padding:15px; border-radius:12px; box-shadow:0 3px 10px #ccc; display:none; }
.add-box input { width:90%; padding:8px; margin:5px; border:1px solid #ccc; border-radius:6px; }
.item { background: white; display: flex; justify-content: space-between; align-items: center; margin: 12px auto; padding: 10px; width: 95%; max-width: 650px; border-radius: 12px; box-shadow: 0 3px 10px #ccc; border-left: 6px solid #4caf50; }
.item.low { border-left-color: red; background: #ffebee; }
.left { display:flex; align-items:center; gap:12px; text-align:left; }
.logo { width:60px; height:60px; border-radius:12px; background:white; display:flex; align-items:center; justify-content:center; overflow:hidden; border:1px solid #eee; }
.logo img { width:100%; height:100%; object-fit:contain; }
.red-badge { background: red; color: white; padding: 3px 8px; border-radius: 10px; font-size: 11px; }
button.sell { background: #ef5350; color: white; padding:7px 14px; margin:0 3px; border:none; border-radius:6px; cursor:pointer; font-weight:bold; }
button.add { background: #66bb6a; color: white; padding:7px 14px; margin:0 3px; border:none; border-radius:6px; cursor:pointer; font-weight:bold; }
button.del { background: #bdbdbd; color:black; padding:7px 10px; margin:0 3px; border:none; border-radius:6px; cursor:pointer; }
@media print { .top-bar, .add-box, button { display:none; } .item { box-shadow:none; border:1px solid #ccc; } }
</style>
</head>
<body>
<h1>المدینہ جنرل سٹور - میلسی</h1>

<div class="top-bar">
  <button class="btn-add" onclick="toggleAdd()">+ نیا مال ڈالیں</button>
  <button class="btn-print" onclick="window.print()">🖨️ بل / پرنٹ</button>
  <button class="btn-clear" onclick="resetStock()">↩️ سٹاک Reset</button>
</div>

<div id="addBox" class="add-box">
  <h3>نیا آئٹم شامل کریں</h3>
  <input id="n_name" placeholder="نام جیسے: Nestle دودھ">
  <input id="n_price" type="number" placeholder="قیمت Rs.">
  <input id="n_stock" type="number" placeholder="سٹاک تعداد">
  <input id="n_img" placeholder="تصویر کا لنک (خالی چھوڑ سکتے ہیں)">
  <button class="btn-add" onclick="addNewProduct()" style="width:90%; margin-top:10px;">محفوظ کریں</button>
</div>

<div id="store"></div>
<h4 style="color:#555;">کل آئٹمز: <span id="total"></span> | کم سٹاک: <span id="lowCount" style="color:red"></span></h4>

<script>
let defaultProducts = [
  { name: "Dalda گھی 5kg", price: 2500, stock: 8, img: "https://storage.pricemeter.pk/images/products/934/b9f824310e-dalda-banaspati-ghee-1kg-gomart-pakistan-452.jpg" },
  { name: "Tapal چائے 500g", price: 650, stock: 10, img: "https://dukaan.b-cdn.net/1000x1000/webp/asgard/02934322f8df9e2491336c5f309a7e288d6fece1d6036232c9b2188ca46bb37f.jpg" },
  { name: "Shan مصالحہ", price: 120, stock: 15, img: "https://gharkasaman.co/cdn/shop/files/SHANCHICKENCURRYMASALA.png" },
  { name: "Surf Excel 1kg", price: 450, stock: 6, img: "https://www.dsmonline.pk/media/catalog/product/cache/e626209f6586797a49e0d0a395e17e33/f/g/fg-0044031.png" },
  { name: "National نمک", price: 80, stock: 2, img: "https://corealliance.org.pk/wp-content/uploads/2025/11/National-Foods-logo-min.png" },
  { name: "چینی 10kg", price: 1500, stock: 10, img: "" },
  { name: "چاول 10kg", price: 2800, stock: 10, img: "" },
  { name: "آٹا 10kg", price: 1300, stock: 10, img: "" }
];

let products = JSON.parse(localStorage.getItem("madina_store") || JSON.stringify(defaultProducts));

function save() { localStorage.setItem("madina_store", JSON.stringify(products)); }

function showStore() {
  let html = ""; let low = 0;
  products.forEach((p, i) => {
    let isLow = p.stock <= 2; if(isLow) low++;
    let logo = p.img ? `<img src="${p.img}" onerror="this.parentElement.innerHTML='📦'">` : `<span style="font-size:28px">📦</span>`;
    html += `<div class="item ${isLow ? 'low' : ''}"><div class="left"><div class="logo">${logo}</div><div><b>${p.name}</b><br>Rs. ${p.price} | سٹاک: <b>${p.stock}</b> ${isLow ? '<br><span class="red-badge">صرف '+p.stock+' باقی 🔴</span>' : ''}</div></div><div><button class="sell" onclick="sellItem(${i})">بیچا -</button><button class="add" onclick="addItem(${i})">واپس +</button><button class="del" onclick="deleteItem(${i})">x</button></div></div>`;
  });
  document.getElementById("store").innerHTML = html;
  document.getElementById("total").innerText = products.length;
  document.getElementById("lowCount").innerText = low;
  save();
}
function sellItem(i){ if(products[i].stock>0){ products[i].stock--; showStore(); } }
function addItem(i){ products[i].stock++; showStore(); }
function deleteItem(i){ if(confirm(products[i].name+" ڈیلیٹ کریں؟")){ products.splice(i,1); showStore(); } }
function toggleAdd(){ let b=document.getElementById("addBox"); b.style.display = b.style.display=="none"||b.style.display=="" ? "block" : "none"; }
function addNewProduct(){
  let name=document.getElementById("n_name").value;
  let price=parseInt(document.getElementById("n_price").value);
  let stock=parseInt(document.getElementById("n_stock").value);
  let img=document.getElementById("n_img").value;
  if(!name || !price || isNaN(stock)){ alert("نام، قیمت، سٹاک لکھیں"); return; }
  products.unshift({name, price, stock, img}); showStore();
  document.getElementById("n_name").value=""; document.getElementById("n_price").value=""; document.getElementById("n_stock").value=""; document.getElementById("n_img").value="";
  toggleAdd();
}
function resetStock(){ if(confirm("سارا سٹاک پہلے جیسا کر دیں؟")){ localStorage.removeItem("madina_store"); products = JSON.parse(JSON.stringify(defaultProducts)); showStore(); } }
showStore();
</script>
</body>
</html>
